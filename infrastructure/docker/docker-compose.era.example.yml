version: '3.8'

services:
  nginx:
    image: nginx:1.20-alpine
    ports:
      - "8080:80"
    depends_on:
      - php

  php:
    image: php:7.4-fpm
    environment:
      APP_ENV: local
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: development
      MYSQL_USER: development
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:6-alpine

volumes:
  mysql-data:
